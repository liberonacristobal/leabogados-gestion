<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <script>
    /* Dominio canónico: si caemos en *.vercel.app (p. ej. tras un redirect de OAuth), volvemos a
       gestion.leabogados.cl conservando ruta, query y hash (los tokens de la sesión viajan en el hash). */
    (function(){ try{ if(location.hostname.indexOf('.vercel.app')!==-1){ location.replace('https://gestion.leabogados.cl'+location.pathname+location.search+location.hash); } }catch(e){} })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FirmDesk"/>
  <meta name="theme-color" content="#003C50"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <title>FirmDesk</title>
  <style>
    html, body { margin:0; padding:0; background:#0F0F0F; }
    /* La página nunca se corre hacia los lados: lo que se salga del ancho se recorta en vez de abrir un desplazamiento horizontal (iPhone) */
    html, body, #root { overflow-x:clip; max-width:100%; }
    /* Filas clickeables de la ficha del cliente (affordance: hover/active + chevron) */
    .lf-row { cursor:pointer; transition:background .12s; }
    .lf-row:hover { background:#F5F7F9; }
    .lf-row:active { background:#EEF1F3; }
    .lf-row .lf-chev { color:#99ABB4; transition:color .12s; }
    .lf-row:hover .lf-chev { color:#537281; }
    .lf-kpi { cursor:pointer; transition:transform .1s; }
    .lf-kpi:active { transform:scale(.985); }
    .lf-kpi:hover .lf-chev { color:#537281; }
    /* Resaltado de tarjetas al pasar el cursor (solo con mouse; el celular no cambia). Alcanza a toda tarjeta tocable (cursor pointer en línea) con borde
       de 0,5 a 1,5 px: div/a/li/label con esquinas de 8 a 16 px, y button con esquinas de 10 a 16 px y el borde neutro de la paleta (los botones de color,
       rojos o azules, no cambian). .hov-card lo fuerza en una que no calce y .sin-hover lo evita. */
    @media (hover:hover) and (pointer:fine) {
      :is(div,a,li,label,section)[style*="cursor: pointer"]:is([style*="border: 1px solid"],[style*="border: 1.5px solid"],[style*="border: 0.5px solid"]):is([style*="border-radius: 8px"],[style*="border-radius: 10px"],[style*="border-radius: 12px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"]):not(.sin-hover),
      button[style*="cursor: pointer"]:is([style*="border: 1px solid rgb(228, 232, 235)"],[style*="border: 1.5px solid rgb(228, 232, 235)"],[style*="border: 0.5px solid rgb(228, 232, 235)"]):is([style*="border-radius: 10px"],[style*="border-radius: 12px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"]):not(.sin-hover),
      .hov-card { transition:border-color .12s, box-shadow .12s, transform .12s; }
      :is(div,a,li,label,section)[style*="cursor: pointer"]:is([style*="border: 1px solid"],[style*="border: 1.5px solid"],[style*="border: 0.5px solid"]):is([style*="border-radius: 8px"],[style*="border-radius: 10px"],[style*="border-radius: 12px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"]):not(.sin-hover):hover,
      button[style*="cursor: pointer"]:is([style*="border: 1px solid rgb(228, 232, 235)"],[style*="border: 1.5px solid rgb(228, 232, 235)"],[style*="border: 0.5px solid rgb(228, 232, 235)"]):is([style*="border-radius: 10px"],[style*="border-radius: 12px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"]):not(.sin-hover):hover,
      .hov-card:hover { border-color:#003C50 !important; box-shadow:0 3px 12px rgba(0,60,80,.14); transform:translateY(-1px); }
    }
    /* Si el sistema pide menos movimiento: el resaltado queda (borde y sombra) pero sin levantar ni animar */
    @media (prefers-reduced-motion:reduce) {
      * { scroll-behavior:auto !important }
      [style*="cursor: pointer"]:hover, .hov-card:hover { transform:none !important }
      [style*="cursor: pointer"], .hov-card { transition:none !important }
    }
    /* Fila marcada con J/K en una lista */
    .fila-foco { outline:2px solid #003C50; outline-offset:-2px; background:#EDF1F4 !important }
    /* Esqueletos de carga (Sk en base.jsx) */
    @keyframes sk-brillo { 0% { background-position:200% 0 } 100% { background-position:-200% 0 } }
    .sk { background:linear-gradient(90deg,#EEF1F3 25%,#F7F9FA 50%,#EEF1F3 75%); background-size:200% 100%; animation:sk-brillo 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce) { .sk { animation:none } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
